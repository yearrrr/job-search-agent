[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "job-search-agent"
version = "0.2.0b3"
description = "本地个人求职管家：证据检索、岗位分析与材料确认"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.141,<0.142", "uvicorn>=0.52,<0.53", "jinja2>=3.1.6,<4",
  "pydantic>=2.13,<3", "python-dotenv>=1.2,<2", "httpx>=0.28,<0.29",
  "langgraph>=1.2,<1.3", "langgraph-checkpoint-sqlite>=3.1,<4",
  "langsmith>=0.12,<0.13",
  "pypdf>=6.18,<7", "python-multipart>=0.0.22,<0.1",
  "pypdfium2>=5.13,<6", "Pillow>=12.3,<13",
  "python-docx>=1.2,<2", "reportlab>=4.4,<5",
]

[project.optional-dependencies]
dev = ["pytest>=9.1,<10", "pytest-socket>=0.8,<1", "ruff>=0.16,<0.17"]

[project.scripts]
job-agent = "job_search_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
job_search_agent = ["templates/*.html", "static/*.css", "static/*.js", "schema.sql", "sample_data/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --disable-socket"
filterwarnings = ["error::DeprecationWarning:job_search_agent.*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
